name: MLflow CI Training

on:
  push:
    branches: [ "main" ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Install Conda & Setup Environment
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: personality-env
          environment-file: MLProject/conda.yaml
          auto-activate-base: false

      - name: Install MLflow and Run Script Directly
        shell: bash -l {0}
        run: |
          pip install mlflow
          cd MLProject
          python modelling.py --data_path predpersonal_preprocessing.csv

      - name: Upload classification report
        uses: actions/upload-artifact@v4
        with:
          name: classification_report
          path: MLProject/classification_report.txt
